server:
  port: ${SERVER_PORT:8081}
  error:
    include-message: always

spring:
  application:
    name: autorizacion-pagos-cooperativa
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pagos_db}
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD:secretpassword123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    default-property-inclusion: non_null
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:admin}
    password: ${RABBITMQ_PASSWORD:secretpassword123}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.cooperativa.pagos: INFO

pagos:
  limites:
    limite-pago: ${LIMITE_PAGO:1000.00}
    limite-diario: ${LIMITE_DIARIO:5000.00}

banco:
  simular:
    demora-ms: ${BANCO_SIMULAR_DEMORA_MS:0}
    fallo: ${BANCO_SIMULAR_FALLO:false}

app:
  rabbitmq:
    exchange: pago.events
    queue: pago.procesado
    routing-key: pago.procesado

