server:
  port: ${SERVER_PORT:8081}
  error:
    include-message: always

spring:
  application:
    name: autorizacion-pagos-cooperativa
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pagos_db}
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD:secretpassword123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    default-property-inclusion: non_null

logging:
  level:
    com.cooperativa.pagos: INFO